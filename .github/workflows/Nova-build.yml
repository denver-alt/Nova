
name: Build Nova APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip -o "NOVA_ANDROID_PROJECT_UPDATED(1)".zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          GRADLE_DIR=$(dirname "$(find project -name gradlew | head -n 1)")
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: project/**/build/outputs/apk/debug/*.apk
